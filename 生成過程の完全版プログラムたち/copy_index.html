<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>予測タイポドメインランキング</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        .ranking-item { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .rank { font-weight: bold; font-size: 1.2em; color: #007bff; margin-right: 10px; }
        .typo { font-weight: bold; font-size: 1.1em; color: #2e2c2c; }
        .score-info { font-size: 0.9em; color: #66707a; }
    </style>
</head>
<body>

    <h1>タイポドメイン予測ランキング</h1>
    <p>ドメイン名を入力し、予測されるタイポドメイン候補をランキング形式で表示します。</p>
    <p>（タイポドメインとは：ユーザのタイプミスを予測したドメインのこと）</p>
    <input type="text" id="domainInput" placeholder="例: gmail.com">
    <button onclick="generateRanking()">タイポドメインを生成</button>

    <hr>

    <h2>予測結果</h2>
    <div id="rankingOutput">
        <p>ドメイン名を入力して「タイポドメイン候補を生成」をクリックしてください。</p>
    </div>

    <script src="typo_ranking.js"></script>

    <script>
        let typoRanker = null;

        /**
         * Pythonで分析・エクスポートされたJSONデータを読み込み、TypoRankerを初期化
         */
        async function initRanker() {
            try {
                // NOTE: 'data.json' は Python スクリプトで生成されたファイルである必要があります
                const response = await fetch('data.json'); 
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                typoRanker = new TypoRanker(data);
                console.log("TypoRanker 初期化完了。重みデータをロードしました。");
            } catch (e) {
                const output = document.getElementById('rankingOutput');
                output.innerHTML = `<p style="color: red;">[エラー] 重みデータ (data.json) の読み込みに失敗しました。Pythonスクリプトを実行してファイルが生成されているか確認してください。<br>エラー詳細: ${e.message}</p>`;
                console.error("JSONロードエラー:", e);
            }
        }

        /**
         * 入力に基づいてランキングを生成し、HTMLに表示する
         */
        function generateRanking() {
            if (!typoRanker) {
                alert("重みデータがまだロードされていません。しばらく待ってから再度お試しください。");
                return;
            }

            const domain = document.getElementById('domainInput').value.trim();
            const outputDiv = document.getElementById('rankingOutput');
            outputDiv.innerHTML = '';

            if (!domain) {
                outputDiv.innerHTML = '<p>ドメイン名を入力してください。</p>';
                return;
            }

            const topN = 10; //上位何件表示するか
            const predictedTypos = typoRanker.typoGeneratorRanked(domain, topN);

            if (predictedTypos.length === 0) {
                outputDiv.innerHTML = `<p><strong>${domain}</strong> に対するタイポ候補は見つかりませんでした。</p>`;
                return;
            }

            let html = `<h3>'${domain}' に対する予測ランキング (上位 ${predictedTypos.length} 件)</h3>`;

            predictedTypos.forEach((r, i) => {
                html += `
                    <div class="ranking-item">
                        <span class="rank">${i + 1}位</span> 
                        <span class="typo">${r.typo}</span>
                        <div class="score-info">
                            スコア: ${r.score.toFixed(6)} | 距離: ${r.distance} | 原因: ${r.causes}
                        </div>
                    </div>
                `;
            });

            outputDiv.innerHTML = html;
        }

        // ページロード時に初期化を実行
        initRanker();

    </script>
</body>
</html>
