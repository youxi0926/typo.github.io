<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ドメインタイポ分析結果</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        h2 { border-bottom: 2px solid #ccc; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>ドメインタイポ分析と予測結果</h1>
    <p>このページは、Pythonスクリプトで生成された静的なJSONデータをもとに表示されています。</p>

    <section id="prediction-ranking">
        <h2>予測タイポドメインランキング</h2>
        <p>（ドメイン: <span id="demo-domain-name"></span>）</p>
        <table id="ranking-table">
            <thead>
                <tr>
                    <th>順位</th>
                    <th>タイポドメイン</th>
                    <th>スコア</th>
                    <th>DL距離</th>
                    <th>主要な原因</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </section>

    <section id="cause-analysis">
        <h2>原因別集計と割合（大分類）</h2>
        <table id="major-weights-table">
            <thead>
                <tr>
                    <th>原因</th>
                    <th>割合（重み）</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </section>

    <script src="script.js"></script>
</body>
</html>
