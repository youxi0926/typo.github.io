<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Email Typo Checker (GitHub Pages)</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; font-size: 16px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; }
        li { margin-bottom: 8px; border-left: 5px solid #007bff; padding: 5px 10px; list-style-type: none; }
        strong { font-weight: bold; }
        .score { font-family: monospace; color: #d9534f; }
    </style>
</head>
<body>
    <h2>防御的ドメイン生成サイト</h2>
    <p id="loadingMessage">データを読み込み中...</p>
    <input type="text" id="domainInput" placeholder="ドメインを入力 (例: example.com)" disabled />
    <button onclick="showTypos()" id="typoButton" disabled>タイポ候補を表示</button>

    <h3>タイポドメイン候補ランキング</h3>
    <ul id="typoList"></ul>

    <script>
        // ====================================================================
        // 1. グローバル定数とデータ読み込み
        // ====================================================================
        let MAJOR_WEIGHTS = {};
        let INDIVIDUAL_WEIGHTS = {};
        let KEYBOARD_ADJACENT = {};
        let SYMMETRIC_KEY_PAIRS = []; 
        let HOMOGLYPHS_FOR_GENERATOR = {}; 

        // 🚨 JSONから読み込む定数（JSONでタプルは文字列に変換されている前提）
        const COMPOSITE_PENALTY_FACTOR = 0.5;

        // --- データ読み込み ---
        async function loadDataAndInitialize() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();

                // Pythonから読み込んだデータでグローバル変数を初期化
                MAJOR_WEIGHTS = data.major_weights;
                INDIVIDUAL_WEIGHTS = data.individual_weights; // 👈 W_individual (文字列キー)
                KEYBOARD_ADJACENT = data.keyboard_adjacent;
                SYMMETRIC_KEY_PAIRS = data.symmetric_key_pairs;
                HOMOGLYPHS_FOR_GENERATOR = data.homoglyphs_for_generator;

                document.getElementById('loadingMessage').textContent = 'データ読み込み完了。';
                document.getElementById('domainInput').disabled = false;
                document.getElementById('typoButton').disabled = false;
                
            } catch (error) {
                document.getElementById('loadingMessage').innerHTML = '<strong>エラー: データ (data.json) の読み込みに失敗しました。</strong>Pythonでファイルを生成し、GitHubにプッシュしたか確認してください。';
                console.error('データの読み込みエラー:', error);
            }
        }
        
        loadDataAndInitialize();

        
        // ====================================================================
        // 2. Pythonヘルパー関数の移植 (最小限の機能)
        // ====================================================================

        function levenshteinDistance(s1, s2) {
            // Python版のロジックに合わせたシンプルなレーベンシュタイン距離
            const track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
            for (let i = 0; i <= s1.length; i += 1) { track[0][i] = i; }
            for (let j = 0; j <= s2.length; j += 1) { track[j][0] = j; }
            for (let j = 1; j <= s2.length; j += 1) {
                for (let i = 1; i <= s1.length; i += 1) {
                    const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
                    track[j][i] = Math.min(
                        track[j][i - 1] + 1, track[j - 1][i] + 1, track[j - 1][i - 1] + indicator
                    );
                }
            }
            return track[s2.length][s1.length];
        }

        function isAdjacent(c1, c2) {
             c1 = c1.toLowerCase(); c2 = c2.toLowerCase();
             // c2がKEYBOARD_ADJACENT[c1]に含まれているかをチェック (includesは文字列でも動作)
             return (KEYBOARD_ADJACENT[c1] && KEYBOARD_ADJACENT[c1].includes(c2));
        }

        function identifySingleReplacement(correct, typo) {
            // Python版の簡易実装 (DL距離1の単一ミスを特定)
            // 置換チェック (Replace)
            if (correct.length === typo.length && Math.abs(correct.length - typo.length) === 0) {
                let diffIndex = -1;
                for (let i = 0; i < correct.length; i++) {
                    if (correct[i] !== typo[i]) {
                        if (diffIndex !== -1) return ['', '']; 
                        diffIndex = i;
                    }
                }
                return diffIndex !== -1 ? [correct[diffIndex], typo[diffIndex]] : ['', ''];
            }
            
            // 挿入/削除チェック (Insert/Delete) - 1文字差のみ
            if (Math.abs(correct.length - typo.length) === 1) {
                if (correct.length < typo.length) { // 挿入 (二重入力)
                    for(let i=0; i<typo.length; i++) {
                        if (typo.slice(0, i) + typo.slice(i + 1) === correct) {
                            return ['（空）', typo[i]];
                        }
                    }
                } else { // 削除 (入力漏れ/ドット抜け)
                     for(let i=0; i<correct.length; i++) {
                        if (correct.slice(0, i) + correct.slice(i + 1) === typo) {
                            return [correct[i], '（空）'];
                        }
                    }
                }
            }
            return ['', '']; 
        }

        // ====================================================================
        // 3. 予測生成とスコアリング (W_individual を主軸に修正)
        // ====================================================================

        function generateTyposRanked(domain, individualWeights) {
            let variants = new Map(); 

            for (let i = 0; i < domain.length; i++) {
                const c = domain[i];
                const cLower = c.toLowerCase();

                // 1. 入力漏れ (Deletion)
                const delTy = domain.slice(0, i) + domain.slice(i + 1);
                variants.set(delTy, (variants.get(delTy) || new Set()).add(c === '.' ? "ドット抜け" : "入力漏れ"));

                // 2. 二重入力 (Insertion/Repetition)
                const dupTy = domain.slice(0, i) + c + c + domain.slice(i + 1);
                variants.set(dupTy, (variants.get(dupTy) || new Set()).add("二重入力"));

                // 3. 置換ミス生成
                const substitutionCauses = {
                    "隣接キー誤打": KEYBOARD_ADJACENT[cLower],
                    "ホモグリフ（視覚類似文字）": HOMOGLYPHS_FOR_GENERATOR[cLower]
                    // 左右対称キー生成ロジックは煩雑なため省略
                };

                for (const cause in substitutionCauses) {
                    const adjChars = substitutionCauses[cause];
                    if (adjChars) {
                        // adjCharsが文字列 ('wa') や配列の場合に対応
                        for (const adj of Array.isArray(adjChars) ? adjChars : adjChars.split('')) {
                            const adjTy = domain.slice(0, i) + adj + domain.slice(i + 1);
                            variants.set(adjTy, (variants.get(adjTy) || new Set()).add(cause));
                        }
                    }
                }

                // 4. 入力順序ミス (Transposition)
                if (i < domain.length - 1) {
                    const swapTy = domain.slice(0, i) + domain[i + 1] + domain[i] + domain.slice(i + 2);
                    variants.set(swapTy, (variants.get(swapTy) || new Set()).add("入力順序ミス"));
                }
                
                // 5. ドット抜け (Deletion of dot - 複数ドット対応は省略)
            }

            // スコアリングとランキング
            let rankedResults = [];
            for (let [typo, causes] of variants.entries()) {
                if (typo === domain) continue;
                
                let finalScore = 0;
                let numCauses = causes.size;
                
                // 距離1のミスの文字ペアを特定 (スコアリングの必須要件)
                const [c1, c2] = identifySingleReplacement(domain, typo);

                // 1. 個別ミス重み (W_individual) の適用
                causes.forEach(cause => {
                    let W_individual = 0.0;
                    let keyStr = '';

                    // キーの構築: Pythonの集計ロジックに合わせる
                    if (cause === "入力順序ミス") {
                        // 転置は特殊: 常に文字列キーを試みる
                        const pair = [domain[i], typo[i]]; // これは簡易的な推測
                        keyStr = `${domain.charAt(i)}${domain.charAt(i + 1)} -> ${typo.charAt(i)}${typo.charAt(i + 1)}`;
                        // 🚨 実際はidentifySingleReplacementやget_transposed_pairに依存すべき
                    } else if (c1 && c2 && c1 !== '（空）' && c2 !== '（空）') {
                        // 置換系: c1c2 または c2c1 (JSONのキーはタプルではなく文字列)
                        keyStr = c1 + c2;
                    } else if (c2 === '（空）' && c1) {
                        // 削除系
                        keyStr = c1 + '（空）';
                    } else if (c1 === '（空）' && c2) {
                        // 挿入系
                        keyStr = '（空）' + c2;
                    }

                    if (individualWeights[cause]) {
                         // 内部重みの参照 (JSONのキーは文字列なので直接参照)
                         W_individual = individualWeights[cause][keyStr] || 0.0;
                         
                         // 逆順チェック (置換系のみ)
                         if (W_individual === 0.0 && keyStr.length === 2 && keyStr.includes('（空）') === false) {
                            W_individual = individualWeights[cause][keyStr.split('').reverse().join('')] || 0.0;
                         }
                    }
                    
                    finalScore += W_individual;
                });
                

                // 2. 複合ミス ペナルティ
                if (numCauses > 1) {
                    finalScore *= COMPOSITE_PENALTY_FACTOR; 
                }
                
                // 3. ボーナス (極小に維持)
                if (causes.has("入力漏れ") || causes.has("二重入力") || causes.has("ドット抜け")) {
                     finalScore += 0.000001; 
                }

                rankedResults.push({
                    typo: typo,
                    causes: Array.from(causes).join('・'),
                    score: finalScore,
                    distance: levenshteinDistance(domain, typo)
                });
            }

            rankedResults.sort((a, b) => b.score - a.score);
            return rankedResults.slice(0, 10);
        }
        
        // ... (UI操作ロジック showTypos/extractDomain は変更なし) ...

        function extractDomain(input) {
            return input.split('@').length > 1 ? input.split('@')[1] : input;
        }

        function showTypos() {
            if (Object.keys(MAJOR_WEIGHTS).length === 0) {
                 document.getElementById('typoList').innerHTML = "<li>データを待機中です...</li>";
                 return;
            }
            
            const inputElement = document.getElementById("domainInput");
            const inputDomain = inputElement.value.trim();
            const domain = extractDomain(inputDomain);

            const list = document.getElementById("typoList");
            list.innerHTML = "";

            if (!domain) {
                list.innerHTML = "<li>ドメインを入力してください。</li>";
                return;
            }

            const typos = generateTyposRanked(domain, INDIVIDUAL_WEIGHTS);

            typos.forEach((t, index) => {
                const li = document.createElement("li");
                
                const fullAddress = inputDomain.includes('@') 
                    ? inputDomain.replace(domain, t.typo) 
                    : t.typo;
                
                li.innerHTML = `
                    <strong>${index + 1}位: ${fullAddress}</strong>
                    (スコア: ${t.score.toFixed(6)}, 距離: ${t.distance}, 原因: ${t.causes})
                `;
                list.appendChild(li);
            });
            
            if (typos.length === 0) {
                 list.innerHTML = "<li>候補は見つかりませんでした。</li>";
            }
        }
    </script>
</body>
</html>
