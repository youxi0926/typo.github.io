<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Email Typo Checker (GitHub Ready)</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; }
        li { margin-bottom: 8px; border-left: 5px solid #007bff; padding-left: 10px; }
    </style>
</head>
<body>
    <h2>防御的ドメイン生成サイト</h2>
    <p id="loadingMessage">データを読み込み中...</p>
    <input type="text" id="domainInput" placeholder="ドメインを入力 (例: treasurefactory.co.jp)" disabled />
    <button onclick="showTypos()" id="typoButton" disabled>タイポ候補を表示</button>

    <h3>タイポドメイン候補一覧</h3>
    <ul id="typoList"></ul>

    <script>
        // グローバルスコープで変数を定義（fetch後にデータが入る）
        let MAJOR_WEIGHTS = {};
        let KEYBOARD_ADJACENT = {};
        let SYMMETRIC_KEY_PAIRS = [/*...データが入る...*/]; 
        let HOMOGLYPH_PAIRS = [/*...データが入る...*/];
        let HOMOGLYPHS_FOR_GENERATOR = {}; // (生成用辞書も必要)


        // 🚨 データの二重定義を避けるため、JavaScript内の定数定義は全て削除しました。 🚨
        
        
        // ====================================================================
        // データの非同期読み込みと初期化 (fetch処理を関数化)
        // ====================================================================

        async function loadDataAndInitialize() {
            try {
                // データの読み込み（data.jsonはPythonで生成されている必要があります）
                const response = await fetch('data.json');
                const data = await response.json();

                // Pythonから読み込んだデータでグローバル変数を初期化
                MAJOR_WEIGHTS = data.major_weights;
                KEYBOARD_ADJACENT = data.keyboard_adjacent;
                // 🚨 ここで他の定数もdata.jsonから読み込む必要があります 🚨
                // 例: SYMMETRIC_KEY_PAIRS = data.symmetric_key_pairs; 
                //     HOMOGLYPH_PAIRS = data.homoglyph_pairs; 

                document.getElementById('loadingMessage').textContent = 'データ読み込み完了。';
                document.getElementById('domainInput').disabled = false;
                document.getElementById('typoButton').disabled = false;
                
            } catch (error) {
                document.getElementById('loadingMessage').textContent = 'エラー: データ (data.json) の読み込みに失敗しました。Pythonでファイルを生成し、GitHubにプッシュしてください。';
                console.error('データの読み込みエラー:', error);
            }
        }
        
        // ページロード時にデータ読み込みを開始
        loadDataAndInitialize();


        // ====================================================================
        // 1. PythonロジックのJavaScript移植
        // ====================================================================

        function levenshteinDistance(s1, s2) {
            // ... (既存のLevenshteinDistanceロジックは変更なし) ...
            const track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
            for (let i = 0; i <= s1.length; i += 1) { track[0][i] = i; }
            for (let j = 0; j <= s2.length; j += 1) { track[j][0] = j; }
            for (let j = 1; j <= s2.length; j += 1) {
                for (let i = 1; i <= s1.length; i += 1) {
                    const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
                    track[j][i] = Math.min(
                        track[j][i - 1] + 1, // deletion
                        track[j - 1][i] + 1, // insertion
                        track[j - 1][i - 1] + indicator // substitution
                    );
                }
            }
            return track[s2.length][s1.length];
        }


        function generateTyposRanked(domain, majorWeights) {
            let variants = new Map(); // Map<typo, Set<causes>>

            for (let i = 0; i < domain.length; i++) {
                const c = domain[i];
                const cLower = c.toLowerCase();

                // 1. 入力漏れ
                const delTy = domain.slice(0, i) + domain.slice(i + 1);
                variants.set(delTy, (variants.get(delTy) || new Set()).add("入力漏れ"));

                // 2. 二重入力
                const dupTy = domain.slice(0, i) + c + c + domain.slice(i + 1); // 修正: i+1にすべき
                variants.set(dupTy, (variants.get(dupTy) || new Set()).add("二重入力"));

                // 3. ⬇️ 修正: 隣接キー誤打 (全隣接キーを生成) ⬇️
                if (KEYBOARD_ADJACENT[cLower]) {
                    // KEYBOARD_ADJACENT[cLower]は文字列なので、1文字ずつループ
                    for (const adj of KEYBOARD_ADJACENT[cLower]) {
                        const adjTy = domain.slice(0, i) + adj + domain.slice(i + 1);
                        variants.set(adjTy, (variants.get(adjTy) || new Set()).add("隣接キー誤打"));
                    }
                }
                // ⬆️ 修正: 隣接キー誤打 ⬆️
                
                // 4. 入力順序ミス (隣接文字の転置)
                if (i < domain.length - 1) {
                    const swapTy = domain.slice(0, i) + domain[i + 1] + domain[i] + domain.slice(i + 2);
                    variants.set(swapTy, (variants.get(swapTy) || new Set()).add("入力順序ミス"));
                }
                
                // 🚨 注意: ホモグリフと左右対称キーの生成ロジックが欠落しています。
                //          それらのデータとロジックをここで追加する必要があります。
            }

            // スコアリングとランキング
            let rankedResults = [];
            for (let [typo, causes] of variants.entries()) {
                if (typo === domain) continue;
                
                let finalScore = 0;
                let numCauses = causes.size;
                
                // 1. 基本スコア計算 (個別重み付けは省略)
                causes.forEach(cause => {
                    finalScore += majorWeights[cause] || 0;
                });

                // 2. 複合ミス ペナルティ
                if (numCauses > 1) {
                    finalScore *= 0.5; // 複合ミスは50%減点
                }
                
                // 3. 入力漏れ/二重入力のボーナス
                if (causes.has("入力漏れ") || causes.has("二重入力")) {
                     finalScore += 0.05; 
                }

                rankedResults.push({
                    typo: typo,
                    causes: Array.from(causes).join('・'),
                    score: finalScore,
                    distance: levenshteinDistance(domain, typo)
                });
            }

            rankedResults.sort((a, b) => b.score - a.score);
            return rankedResults.slice(0, 10);
        }

        // ====================================================================
        // 2. UI操作ロジック
        // ====================================================================

        function extractDomain(input) {
            return input.split('@').length > 1 ? input.split('@')[1] : input;
        }

        function showTypos() {
            // データが読み込まれていない場合は実行しない
            if (Object.keys(MAJOR_WEIGHTS).length === 0) {
                 document.getElementById('typoList').innerHTML = "<li>データを待機中です...</li>";
                 return;
            }
            
            const inputElement = document.getElementById("domainInput");
            const inputDomain = inputElement.value.trim();
            const domain = extractDomain(inputDomain);

            const list = document.getElementById("typoList");
            list.innerHTML = "";

            if (!domain) {
                list.innerHTML = "<li>ドメインを入力してください。</li>";
                return;
            }

            const typos = generateTyposRanked(domain, MAJOR_WEIGHTS);

            typos.forEach((t, index) => {
                const li = document.createElement("li");
                
                const fullAddress = inputDomain.includes('@') 
                    ? inputDomain.replace(domain, t.typo) 
                    : t.typo;
                
                li.innerHTML = `
                    <strong>${index + 1}位: ${fullAddress}</strong>
                    (スコア: ${t.score.toFixed(3)}, 距離: ${t.distance}, 原因: ${t.causes})
                `;
                list.appendChild(li);
            });
            
            if (typos.length === 0) {
                 list.innerHTML = "<li>候補は見つかりませんでした。</li>";
            }
        }
    </script>
</body>
</html>
